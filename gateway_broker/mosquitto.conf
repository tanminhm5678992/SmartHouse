# ========================================================
# KIẾN TRÚC BẮT BUỘC SLIDE 19: TẦNG 2 - BROKER LOCAL (GATEWAY)
# ========================================================

# Lắng nghe kết nối từ các thiết bị IoT trong mạng nội bộ
listener 1883 0.0.0.0
allow_anonymous true
set_tcp_nodelay true
max_keepalive 300

# ========================================================
# CẦU BRIDGE KẾT NỐI TỚI BROKER SERVER (TẦNG 3)
# ========================================================
connection bridge-to-cloud-server
address broker_server:1883

# Chuyển tiếp 2 chiều toàn bộ topic home/# giữa Local và Server (QoS 1)
topic home/# both 1 "" ""

# Thông tin xác thực lên Broker Server
remote_clientid gateway_edge_node_1
remote_username server_iot_admin
remote_password secure_mqtt_password_2026
keepalive_interval 30
restart_timeout 5
